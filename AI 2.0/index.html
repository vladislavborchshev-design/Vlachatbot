<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vlachatbot</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            text-align: center;
        }

        #chat {
            min-height: 250px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
        }

        .user {
            background: #dff0ff;
            text-align: right;
        }

        .bot {
            background: #eeeeee;
        }

        input {
            width: calc(100% - 110px);
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 8px;
        }

        button {
            width: 100px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #answerArea {
            margin-top: 15px;
            display: none;
        }

        #answerInput {
            width: 100%;
            margin-bottom: 10px;
        }

        #saveButton {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Vlachatbot</h1>

    <div id="chat"></div>

    <div>
        <input
            id="questionInput"
            type="text"
            placeholder="Задай вопрос..."
        >

        <button onclick="askQuestion()">
            Отправить
        </button>
    </div>

    <div id="answerArea">

        <p>
            Я не знаю ответа. Научи меня:
        </p>

        <input
            id="answerInput"
            type="text"
            placeholder="Напиши правильный ответ..."
        >

        <button id="saveButton" onclick="teachModel()">
            Запомнить
        </button>

    </div>

</div>


<script>

let currentQuestion = "";


function addMessage(text, type) {

    const chat = document.getElementById("chat");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


async function askQuestion() {

    const input = document.getElementById("questionInput");

    const question = input.value.trim();

    if (!question) {
        return;
    }

    currentQuestion = question;

    addMessage("Ты: " + question, "user");

    input.value = "";

    const response = await fetch("/ask", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            question: question
        })

    });


    const data = await response.json();


    if (data.known) {

        addMessage(
            "Модель: " + data.answer,
            "bot"
        );

        document.getElementById("answerArea").style.display = "none";

    } else {

        addMessage(
            "Модель: " + data.message,
            "bot"
        );

        document.getElementById("answerArea").style.display = "block";

        document.getElementById("answerInput").focus();
    }
}


async function teachModel() {

    const answerInput =
        document.getElementById("answerInput");

    const answer = answerInput.value.trim();

    if (!answer) {
        return;
    }


    const response = await fetch("/teach", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            question: currentQuestion,

            answer: answer

        })

    });


    const data = await response.json();


    if (data.success) {

        addMessage(
            "Модель: " + data.message,
            "bot"
        );

        answerInput.value = "";

        document.getElementById("answerArea").style.display = "none";
    }
}

</script>

</body>
</html>
